<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="reels_bg" x1="20" y1="20" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2A54"/>
      <stop offset="0.5" stop-color="#FF007A"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glass_overlay" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="camera_grad" x1="60" y1="70" x2="180" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF0F5"/>
    </linearGradient>
    <filter id="glow_reels" x="10" y="10" width="220" height="220" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FF007A" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  {/* Rounded Square 1:1 Container */}
  <rect x="10" y="10" width="220" height="220" rx="36" fill="url(#reels_bg)" filter="url(#glow_reels)"/>
  <rect x="10" y="10" width="220" height="220" rx="36" fill="url(#glass_overlay)"/>
  
  {/* Glossy Curved Highlight */}
  <path d="M10 46C10 26.1178 26.1178 10 46 10H194C213.882 10 230 26.1178 230 46V70C150 110 90 60 10 100V46Z" fill="#FFFFFF" fill-opacity="0.2"/>
  
  {/* Center 3D Reels Element */}
  <rect x="55" y="65" width="130" height="110" rx="28" fill="url(#camera_grad)"/>
  <polygon points="105,96 148,120 105,144" fill="#FF007A"/>
  <circle cx="160" cy="85" r="8" fill="#FF2A54"/>
  <rect x="75" y="55" width="90" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.9"/>
</svg>
