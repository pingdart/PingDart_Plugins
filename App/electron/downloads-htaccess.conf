# /home/chatpingdart/public_html/downloads/.htaccess
# Production Configuration for PingDart Multi-OS Electron Auto-Updates (Windows, macOS, Linux)

<IfModule mod_headers.c>
    # Enable CORS so Electron clients on all OSes can query metadata without origin blocks
    Header set Access-Control-Allow-Origin "*"
    Header set Access-Control-Allow-Methods "GET, HEAD, OPTIONS"
    Header set Access-Control-Allow-Headers "*"

    # Never cache version metadata files (Windows, macOS, and Linux)
    <FilesMatch "latest.*\.ya?ml$">
        Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
        Header set Pragma "no-cache"
    </FilesMatch>

    # Cache large binary installers, delta blockmaps, and zip archives (1 month)
    <FilesMatch "\.(exe|blockmap|zip|dmg|AppImage)$">
        Header set Cache-Control "public, max-age=2592000"
    </FilesMatch>
</IfModule>

# Ensure Apache serves correct MIME types for electron-updater
AddType text/yaml .yml
AddType text/yaml .yaml
AddType application/octet-stream .blockmap
AddType application/vnd.microsoft.portable-executable .exe
AddType application/zip .zip
AddType application/x-apple-diskimage .dmg
AddType application/vnd.appimage .AppImage

# Disable directory browsing for security
Options -Indexes
